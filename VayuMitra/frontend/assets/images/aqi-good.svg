<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" fill="none" role="img" aria-label="Two healthy happy characters enjoying clean fresh air outdoors">
  <defs>
    <linearGradient id="skyGood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFF5EC"/>
      <stop offset="100%" stop-color="#F4FBF7"/>
    </linearGradient>
    <linearGradient id="hillGood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ADBB0"/>
      <stop offset="100%" stop-color="#58C188"/>
    </linearGradient>
  </defs>
  <rect width="380" height="260" rx="22" fill="url(#skyGood)"/>
  <!-- Sun & Soft Clouds -->
  <circle cx="318" cy="48" r="24" fill="#FDE68A" opacity="0.85"/>
  <circle cx="318" cy="48" r="16" fill="#FBBF24" opacity="0.75"/>
  <path d="M52 54C52 46 60 40 69 42C73 34 86 33 93 41C101 40 108 46 108 54H52Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M210 42C210 36 216 32 223 33C226 27 236 27 241 33C247 32 252 36 252 42H210Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- Fresh Breeze Swirls -->
  <path d="M28 96C62 88 86 98 112 90" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M254 88C284 82 312 92 344 82" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Rolling Green Ground -->
  <path d="M0 202C76 176 168 188 248 180C302 174 344 182 380 194V260H0V202Z" fill="url(#hillGood)" opacity="0.45"/>
  <path d="M0 218C96 202 212 204 380 220V260H0V218Z" fill="#2E9E5B" opacity="0.28"/>

  <!-- Character 1 (Left - Young Woman, Happy & Healthy, No Mask) -->
  <g transform="translate(86, 62)">
    <!-- Shadow -->
    <ellipse cx="44" cy="166" rx="34" ry="7" fill="#155E3A" opacity="0.16"/>
    <!-- Legs -->
    <rect x="29" y="122" width="11" height="40" rx="5.5" fill="#1E3A5F"/>
    <rect x="47" y="122" width="11" height="40" rx="5.5" fill="#1E3A5F"/>
    <ellipse cx="33" cy="163" rx="8" ry="4.5" fill="#0F766E"/>
    <ellipse cx="54" cy="163" rx="8" ry="4.5" fill="#0F766E"/>
    <!-- Torso (Fresh Teal/Mint Jacket) -->
    <path d="M20 74C20 62 30 56 44 56C58 56 68 62 68 74L72 126C72 130 68 133 63 133H25C20 133 16 130 16 126L20 74Z" fill="#16A34A"/>
    <path d="M36 58H52L44 86L36 58Z" fill="#ECFDF5"/>
    <!-- Raised Happy Arm -->
    <path d="M18 74C8 64 2 48 6 36" stroke="#F4B692" stroke-width="10" stroke-linecap="round"/>
    <circle cx="7" cy="34" r="6" fill="#F4B692"/>
    <!-- Right Arm -->
    <path d="M68 74C78 86 80 100 76 112" stroke="#15803D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="75" cy="114" r="5.5" fill="#F4B692"/>
    <!-- Hair Back -->
    <circle cx="44" cy="30" r="23" fill="#2C1B18"/>
    <path d="M21 34C20 46 24 54 30 56H58C64 54 68 46 67 34" fill="#2C1B18"/>
    <!-- Neck & Face -->
    <rect x="38" y="45" width="12" height="14" rx="5" fill="#F4B692"/>
    <circle cx="44" cy="33" r="18" fill="#F4B692"/>
    <!-- Hair Bangs -->
    <path d="M26 28C29 16 42 13 54 17C60 19 63 25 62 30C55 24 41 23 26 28Z" fill="#2C1B18"/>
    <!-- Happy Eyes & Big Smile -->
    <path d="M34 31C35.5 28.5 38.5 28.5 40 31" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M48 31C49.5 28.5 52.5 28.5 54 31" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="32" cy="36" r="2.8" fill="#F87171" opacity="0.45"/>
    <circle cx="56" cy="36" r="2.8" fill="#F87171" opacity="0.45"/>
    <path d="M37 39C40 44 48 44 51 39" stroke="#7C2D12" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Right - Young Man, Happy & Healthy, No Mask) -->
  <g transform="translate(202, 56)">
    <!-- Shadow -->
    <ellipse cx="46" cy="172" rx="35" ry="7" fill="#155E3A" opacity="0.16"/>
    <!-- Legs -->
    <rect x="30" y="124" width="12" height="44" rx="6" fill="#1E293B"/>
    <rect x="49" y="124" width="12" height="44" rx="6" fill="#1E293B"/>
    <ellipse cx="35" cy="169" rx="8.5" ry="4.5" fill="#0D9488"/>
    <ellipse cx="56" cy="169" rx="8.5" ry="4.5" fill="#0D9488"/>
    <!-- Torso (Crisp Sky-Teal Shirt) -->
    <path d="M20 72C20 60 31 54 46 54C61 54 72 60 72 72L74 128C74 132 70 135 65 135H27C22 135 18 132 18 128L20 72Z" fill="#0EA5E9"/>
    <path d="M36 55L46 68L56 55" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Arm Relaxed -->
    <path d="M19 74C10 88 10 104 15 114" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="16" cy="116" r="5.5" fill="#E8A985"/>
    <!-- Right Arm Giving Thumbs Up / Wave -->
    <path d="M72 74C84 64 90 48 86 36" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="85" cy="34" r="6" fill="#E8A985"/>
    <!-- Neck & Face -->
    <rect x="40" y="44" width="12" height="14" rx="5" fill="#E8A985"/>
    <circle cx="46" cy="31" r="18.5" fill="#E8A985"/>
    <!-- Hair -->
    <path d="M27 28C27 14 40 9 54 12C63 14 66 22 65 30C58 22 39 20 27 28Z" fill="#1E293B"/>
    <!-- Happy Eyes & Smile -->
    <circle cx="39" cy="30" r="2.2" fill="#1F2937"/>
    <circle cx="53" cy="30" r="2.2" fill="#1F2937"/>
    <circle cx="34" cy="35" r="2.8" fill="#F87171" opacity="0.42"/>
    <circle cx="58" cy="35" r="2.8" fill="#F87171" opacity="0.42"/>
    <path d="M39 38C42 43 50 43 53 38" stroke="#7C2D12" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Floating Green Leaves -->
  <path d="M44 154C44 146 52 140 60 142C58 150 52 156 44 154Z" fill="#22C55E"/>
  <path d="M328 140C328 132 336 126 344 128C342 136 336 142 328 140Z" fill="#16A34A"/>
</svg>
