<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" fill="none" role="img" aria-label="Two seriously concerned characters wearing protective masks in hazardous air quality">
  <defs>
    <linearGradient id="skyWorse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="smogWorse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="380" height="260" rx="22" fill="url(#skyWorse)"/>
  <!-- Dense Hazardous Haze & Warning Triangle Icon -->
  <rect x="0" y="76" width="380" height="118" fill="url(#smogWorse)"/>
  <circle cx="48" cy="52" r="4.5" fill="#DC2626" opacity="0.32"/>
  <circle cx="118" cy="36" r="3.5" fill="#DC2626" opacity="0.28"/>
  <circle cx="268" cy="48" r="4" fill="#DC2626" opacity="0.3"/>
  <circle cx="336" cy="96" r="5" fill="#DC2626" opacity="0.32"/>
  <circle cx="34" cy="144" r="4" fill="#DC2626" opacity="0.3"/>
  <!-- Ground -->
  <path d="M0 206C92 188 188 196 280 186C325 182 356 188 380 198V260H0V206Z" fill="#F87171" opacity="0.3"/>
  <path d="M0 222C110 210 230 210 380 222V260H0V222Z" fill="#991B1B" opacity="0.2"/>

  <!-- Character 1 (Left - Seriously Concerned, Respirator Mask, Protective Posture) -->
  <g transform="translate(86, 64)">
    <ellipse cx="44" cy="164" rx="34" ry="7" fill="#7F1D1D" opacity="0.18"/>
