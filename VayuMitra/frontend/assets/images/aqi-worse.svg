    <path d="M18 76C8 92 20 100 38 92" stroke="#991B1B" stroke-width="10" stroke-linecap="round"/>
    <circle cx="40" cy="91" r="5.5" fill="#F4B692"/>
    <path d="M68 76C78 88 70 98 54 96" stroke="#991B1B" stroke-width="10" stroke-linecap="round"/>
    <circle cx="52" cy="95" r="5.5" fill="#F4B692"/>
    <!-- Head & Hair -->
    <circle cx="44" cy="31" r="23" fill="#2C1B18"/>
    <path d="M21 35C20 47 24 55 30 57H58C64 55 68 47 67 35" fill="#2C1B18"/>
    <rect x="38" y="45" width="12" height="14" rx="5" fill="#F4B692"/>
