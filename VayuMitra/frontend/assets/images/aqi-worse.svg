    <rect x="40" y="44" width="12" height="14" rx="5" fill="#E8A985"/>
    <circle cx="46" cy="32" r="18.5" fill="#E8A985"/>
    <path d="M27 29C27 15 40 10 54 13C63 15 66 23 65 31C58 23 39 21 27 29Z" fill="#1E293B"/>
    <!-- Concerned Brows & Eyes -->
    <path d="M34 25L42 23" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M58 25L50 23" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="39" cy="29.5" r="2.6" fill="#1F2937"/>
    <circle cx="53" cy="29.5" r="2.6" fill="#1F2937"/>
    <!-- Respirator Mask -->
    <path d="M27 34L32 35M65 34L60 35" stroke="#991B1B" stroke-width="1.8"/>
    <path d="M31 33C38 29 54 29 61 33L59 46C52 51 40 51 33 46L31 33Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
    <circle cx="46" cy="40" r="4.5" fill="#FECACA" stroke="#DC2626" stroke-width="1.3"/>
