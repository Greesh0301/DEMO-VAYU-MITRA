    <path d="M56 27L48 25" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="37" cy="31" r="2.6" fill="#1F2937"/>
    <circle cx="51" cy="31" r="2.6" fill="#1F2937"/>
    <!-- Heavy Respirator Mask -->
    <path d="M25 36L30 37M63 36L58 37" stroke="#991B1B" stroke-width="1.8"/>
    <path d="M29 35C36 31 52 31 59 35L57 48C50 53 38 53 31 48L29 35Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
    <circle cx="44" cy="42" r="4.5" fill="#FECACA" stroke="#DC2626" stroke-width="1.3"/>
  </g>

  <!-- Character 2 (Right - Seriously Concerned, Respirator Mask, Hand Shielding) -->
  <g transform="translate(202, 58)">
    <ellipse cx="46" cy="170" rx="35" ry="7" fill="#7F1D1D" opacity="0.18"/>
    <rect x="30" y="124" width="12" height="42" rx="6" fill="#0F172A"/>
    <rect x="49" y="124" width="12" height="42" rx="6" fill="#0F172A"/>
    <ellipse cx="35" cy="167" rx="8.5" ry="4.5" fill="#7F1D1D"/>
    <ellipse cx="56" cy="167" rx="8.5" ry="4.5" fill="#7F1D1D"/>
    <path d="M20 73C20 61 31 55 46 55C61 55 72 61 72 73L74 128C74 132 70 135 65 135H27C22 135 18 132 18 128L20 73Z" fill="#B91C1C"/>
