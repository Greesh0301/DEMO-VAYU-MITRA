    <rect x="47" y="122" width="11" height="38" rx="5.5" fill="#1E293B"/>
    <ellipse cx="33" cy="161" rx="8" ry="4.5" fill="#7F1D1D"/>
    <ellipse cx="54" cy="161" rx="8" ry="4.5" fill="#7F1D1D"/>
